- name: install nginx
  become: yes
  hosts: web
  vars_files:
    - inventory/group_vars/myvault.yml
  tasks:
    - name: installing nginx
      package:
        name: nginx
        state: present
    - name: start nginx
      service:
        name: nginx
        state: started
        enabled: yes
    - name: display details
      debug:
        var: pass