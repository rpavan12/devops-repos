# varibale in same playbook
---
- hosts: backend
  become: yes
  vars:
    type: nginx
    version: latest
  tasks:
    - name: Ensure nginx is installed and running
      yum:
        name: "{{ type }}"
        state: present
    - name: print software details
      debug:
        msg: "whe have installed {{ type }} and version is {{ version }}"
