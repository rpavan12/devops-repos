apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-app-deployment
  labels:
    app: game-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: game-app
  template:
    metadata:
      labels:
        app: game-app
    spec: 
      initContainers:
      - name: copy-app
        image: rpavan222/pavan:2.0
        command: ["sh", "-c", "cp -r /usr/share/nginx/html/* /data/"]
        volumeMounts:
        - name: storage
          mountPath: /data

      containers:
      - name: game-app-container
        image: rpavan222/pavan:2.0
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: storage
      volumes:
      - name: storage
        persistentVolumeClaim:
          claimName: my-ebs-pvc
